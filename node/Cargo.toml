[package]
name = "fable"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "2"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.3"
hmac = "0.13.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
pbkdf2 = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
slh-dsa = "=0.2.0-rc.5"
unicode-normalization = "0.1.26"

# SLH-DSA is unusable without optimisation: optimise dependencies even in debug and test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
